# mongot for the NovelHub shared replica set (no secrets in this file).
syncSource:
  replicaSet:
    hostAndPort: "mongodb:27017"
    scramAuth:
      username: mongotUser
      authSource: admin
      passwordFile: /etc/mongot/secrets/passwordFile
      tls:
        enabled: false
storage:
  dataPath: "/var/lib/mongot"
server:
  grpc:
    address: "mongot:27028"
    tls:
      mode: "disabled"
metrics:
  enabled: true
  address: "mongot:9946"
healthCheck:
  address: "mongot:8080"
logging:
  verbosity: INFO
