# NovelHub shared MongoDB (single-node replica set so multi-document
# transactions work). Clients connect with directConnection=true.
name: novelhub-mongo

services:
  mongodb:
    image: mongo:8.0
    container_name: novelhub_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-keyfile:/tmp/mongo-keyfile:ro
    entrypoint:
      - bash
      - -c
      - |
        cp /tmp/mongo-keyfile /data/configdb/keyfile
        chmod 400 /data/configdb/keyfile
        chown mongodb:mongodb /data/configdb/keyfile
        exec docker-entrypoint.sh "$$@"
      - --
    command: ['mongod', '--replSet', 'rs0', '--keyFile', '/data/configdb/keyfile', '--bind_ip_all']
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '-u',
          '${MONGO_ROOT_USERNAME}',
          '-p',
          '${MONGO_ROOT_PASSWORD}',
          '--authenticationDatabase',
          'admin',
          '--eval',
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongodb_data:
  mongodb_config:
