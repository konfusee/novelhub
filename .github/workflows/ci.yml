name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.0.32
      - run: npm run format:check
      - run: npm run lint
      - name: Check translations
        run: npm run i18n:check --workspace frontend
      - name: Check icon usage
        run: npm run icons:check --workspace frontend
      - run: npm test
      - run: npm run build
